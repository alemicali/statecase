name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run cloud:test
      - run: npm audit --omit=dev --audit-level=high
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  background-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run uat:background

  native-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y dbus libsecret-tools gnome-keyring
      - run: npm ci
      - name: Qualify packaged credentials in a private Secret Service
        run: STATECASE_PACKAGE_NATIVE_CREDENTIALS=1 npm run test:package

  native-macos-credentials:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Qualify packaged credentials in an explicit disposable Keychain
        run: STATECASE_PACKAGE_NATIVE_CREDENTIALS=1 npm run test:package

  native-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Qualify isolated launchd lifecycle
        shell: bash
        run: |
          fixture_root=$(mktemp -d /tmp/statecase-launchd-XXXXXX)
          STATECASE_UAT_CONFIRM=temporary-native-service \
          STATECASE_UAT_ROOT="$fixture_root" \
          STATECASE_UAT_CLI="$GITHUB_WORKSPACE/apps/cli/dist/bin.js" \
          node scripts/uat/native-launchd.mjs

  native-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the qualified native harness version
        run: npm install --prefix "$RUNNER_TEMP/statecase-native-tools" --no-audit --no-fund @openai/codex@0.153.4
      - name: Qualify native session continuity in the disposable runner VM
        shell: bash
        run: |
          STATECASE_UAT_CODEX="$RUNNER_TEMP/statecase-native-tools/node_modules/.bin/codex" \
          STATECASE_UAT_PARENT="$GITHUB_WORKSPACE" \
          STATECASE_UAT_CODEX_SANDBOX=externally-isolated \
          STATECASE_UAT_CONFIRM=run-native-harness-in-disposable-sandbox \
          npm run uat:native-codex

  native-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the qualified native harness version
        run: npm install --prefix "$RUNNER_TEMP/statecase-native-tools" --no-audit --no-fund @anthropic-ai/claude-code@2.1.263
      - name: Qualify native session continuity in the disposable runner VM
        shell: bash
        run: |
          STATECASE_UAT_CLAUDE="$RUNNER_TEMP/statecase-native-tools/node_modules/.bin/claude" \
          STATECASE_UAT_PARENT="$GITHUB_WORKSPACE" \
          STATECASE_UAT_CONFIRM=run-native-harness-in-disposable-sandbox \
          npm run uat:native-claude
      - name: Qualify native memory recall, writes and return transfer
        shell: bash
        run: |
          STATECASE_UAT_CLAUDE="$RUNNER_TEMP/statecase-native-tools/node_modules/.bin/claude" \
          STATECASE_UAT_PARENT="$GITHUB_WORKSPACE" \
          STATECASE_UAT_CONFIRM=run-native-harness-in-disposable-sandbox \
          npm run uat:native-claude -- --memory
